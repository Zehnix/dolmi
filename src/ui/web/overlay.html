<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolmi overlay</title>
<link href="vendor/fonts.css" rel="stylesheet">
<style>
:root{--a:.88;--fs:22px;--ac:#2FB9A4;--src:#E0A05C;--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Fraunces',Georgia,serif;--ui:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;background:transparent;overflow:hidden;font-family:var(--ui)}
.hud{height:100%;background:rgba(22,21,15,var(--a));border:1px solid rgba(255,255,255,.08);border-radius:18px;
  box-shadow:0 10px 36px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;color:#F2ECDE}
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px 5px;cursor:move;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
.nm{font-size:12px;color:#9a917b;font-weight:600;font-family:var(--mono)}
.sp{flex:1}
.srcb{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-family:var(--mono);color:#9a917b;cursor:pointer;max-width:170px}
.srcb svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.srcb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srcb:hover{background:rgba(255,255,255,.08);color:#fff}
.srcb.mic{color:var(--src)}
.x{width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#9a917b;font-size:13px;font-weight:700;cursor:pointer}
.x:hover{background:rgba(255,255,255,.08);color:#fff}
.body{flex:1;overflow:auto;padding:4px 18px 16px;display:flex;flex-direction:column;gap:6px}
/* lines sit at the bottom via an auto top margin, not justify-content:flex-end (that would make the overflow unscrollable) */
.body>:first-child{margin-top:auto}
.de{font-family:var(--mono);font-size:13px;color:#aba28c;line-height:1.4}
.en{font-family:var(--display);font-weight:500;font-size:var(--fs);line-height:1.3;color:#F6F1E7}
.idle{color:#776f59;font-size:14px}
/* APP-8 locked: the window ignores the mouse (clicks go to the meeting below), so its controls are hidden */
.lockm{display:none;align-items:center;gap:4px;font-size:11px;font-family:var(--mono);color:#776f59}
.lockm svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.locked .lockm{display:flex}.locked .x,.locked .srcb,.locked .grip{display:none}.locked .bar{cursor:default}
.grip{position:fixed;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;opacity:.5}
.grip:before{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-right:2px solid #9a917b;border-bottom:2px solid #9a917b;border-radius:0 0 3px 0}
</style>
</head>
<body>
<div class="hud">
  <div class="bar pywebview-drag-region" id="dragbar"><span class="dot pulse" id="dot"></span><span class="nm">Dolmi</span><span class="sp"></span><span class="srcb" id="srcb" title="Listening to the speaker — click to switch to the microphone"><svg viewBox="0 0 24 24"><path id="srcp" d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span id="srct">Speaker</span></span><span class="lockm" id="lockMark" title="Locked: clicks go through. Unlock in Dolmi or with the shortcut"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Locked</span><span class="x" id="close" title="Hide">✕</span></div>
  <div class="body" id="body"><div class="idle" id="idle">Listening…</div></div>
  <div class="grip" id="grip"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const api=()=>window.pywebview&&window.pywebview.api;
const esc=s=>(''+s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const body=$('#body');
function clearIdle(){ const i=$('#idle'); if(i) i.remove(); }
/* follow new lines only while the bar is scrolled to the bottom (scrolling up to re-read stays put).
   Only the reader un-sticks it: autoTop is where follow() last scrolled, so a resize does not. Checked on
   each new line too, since a scroll-up and a line can land before the scroll event. */
let stuck=true,autoTop=0;
const atEnd=()=>body.scrollHeight-body.scrollTop-body.clientHeight<=48;
function check(){ if(stuck){ if(body.scrollTop<autoTop-1&&!atEnd()) stuck=false; } else if(atEnd()) stuck=true; }
body.addEventListener('scroll',check);
const follow=()=>{ if(stuck){ body.scrollTop=body.scrollHeight; autoTop=body.scrollTop; } };
window.ov={
  locked:(on)=>document.documentElement.classList.toggle('locked',!!on),
  style:(a,fs)=>{ document.documentElement.style.setProperty('--a',Math.max(.15,Math.min(1,a))); document.documentElement.style.setProperty('--fs',fs+'px'); },
  idle:(t)=>{ body.innerHTML='<div class="idle">'+esc(t||'Listening…')+'</div>'; stuck=true; autoTop=0; },
  /* 4 lines while live; while the reader is scrolled up, up to 40 so the line being re-read stays put */
  line:(de,en)=>{ check(); clearIdle(); const d=document.createElement('div'); d.innerHTML='<div class="de">'+esc(de)+'</div><div class="en">'+esc(en)+'</div>';
    const dr=document.getElementById('draft'); if(dr) body.insertBefore(d,dr); else body.append(d);
    while(body.children.length>(stuck?4:40)) body.firstChild.remove(); follow(); },
  draft:(de,en)=>{ check(); clearIdle(); let dr=document.getElementById('draft'); if(!de&&!en){ if(dr)dr.remove(); return; } if(!dr){ dr=document.createElement('div'); dr.id='draft'; dr.style.opacity='.65'; body.append(dr); } dr.innerHTML='<div class="de">'+esc(de)+'</div><div class="en">'+esc(en)+'</div>'; follow(); },
};
const ICONS={speaker:'M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',
  mic:'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3'};
window.ov.source=(src,dev)=>{ const mic=src==='mic', b=$('#srcb'); b.classList.toggle('mic',mic); $('#srcp').setAttribute('d',ICONS[mic?'mic':'speaker']);
  $('#srct').textContent=mic?'Mic':'Speaker'; b.title=(mic?'Listening to the microphone: ':'Listening to the speaker: ')+dev+' — click to switch'; };
$('#srcb').addEventListener('mousedown',e=>e.stopPropagation());
$('#srcb').onclick=()=>{ const a=api(); if(a&&a.toggle_source) a.toggle_source(); };
$('#close').onclick=()=>{ const a=api(); if(a&&a.hide) a.hide(); };
/* drag: the bar is a native pywebview drag region (DPI-correct). resize: the grip, in logical
   pixels, one resize in flight at a time so fast mouse moves don't pile up round-trips */
$('#close').addEventListener('mousedown',e=>e.stopPropagation());
let rz=null,busy=false,pending=null;
function pushResize(){ if(busy||!pending)return; const a=api(); if(!a)return; const p=pending; pending=null; busy=true; a.resize(p.w,p.h).finally(()=>{busy=false;pushResize();}); }
$('#grip').addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); const a=api(); if(!a)return; rz={sx:e.screenX,sy:e.screenY}; a.geometry().then(g=>{ if(rz) rz.g=g; }); });
window.addEventListener('mousemove',e=>{ if(!rz||!rz.g)return; pending={w:rz.g.w+(e.screenX-rz.sx),h:rz.g.h+(e.screenY-rz.sy)}; pushResize(); });
window.addEventListener('mouseup',()=>rz=null);
</script>
</body>
</html>
